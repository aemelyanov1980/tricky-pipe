<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея работ — Tricky Pipe Loft</title>
<meta name="description" content="Фото наших работ: полки, стеллажи, светильники и фурнитура из стальных труб. Tricky Pipe Loft — с 2019 года.">

<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">

<style>
  :root{
    --black:#0d0d0d; --dark:#1a1a1a; --card:#232323;
    --cast:#57534e; --silver:#b8bcc2; --white:#f5f5f4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--silver);font-family:'Segoe UI',Arial,sans-serif;line-height:1.6;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px;}
  header{padding:40px 0 10px;text-align:center;}
  h1{color:var(--white);font-size:1.8rem;letter-spacing:2px;}
  .back{display:inline-block;margin-top:14px;color:var(--silver);text-decoration:none;font-size:.95rem;}
  .back:hover{color:var(--white);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:30px 0;}
  .grid a{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--card);}
  .grid img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;
            transition:transform .3s;}
  .grid img:hover{transform:scale(1.03);}
  /* лайтбокс — увеличенное фото по клику */
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);
            z-index:100;align-items:center;justify-content:center;cursor:zoom-out;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;}
  footer{border-top:1px solid var(--card);padding:30px 0 50px;text-align:center;
         font-size:.9rem;color:var(--cast);}
  footer a{color:var(--silver);text-decoration:none;margin:0 10px;}
  footer a:hover{color:var(--white);}
</style>
</head>
<body>
<header class="wrap">
  <h1>Галерея работ</h1>
  <a class="back" href="/">← На главную</a>
</header>

<section class="wrap">
  <div class="grid">
    <a href="/img/gallery/photo1.jpg" target="_blank" rel="noopener"><img src="/img/gallery/1.jpg" alt="Полка из стальных труб" loading="lazy"></a>
    <a href="/img/gallery/photo2.jpg" target="_blank" rel="noopener"><img src="/img/gallery/photo2.jpg" alt="Светильник в стиле лофт" loading="lazy"></a>
    <a href="/img/gallery/photo3.jpg" target="_blank" rel="noopener"><img src="/img/gallery/photo3.jpg" alt="Держатель для туалетной бумаги из труб" loading="lazy"></a>
    <a href="/img/gallery/photo4.jpg" target="_blank" rel="noopener"><img src="/img/gallery/photo4.jpg" alt="Стеллаж из труб и полок" loading="lazy"></a>
    <a href="/img/gallery/photo5.jpg" target="_blank" rel="noopener"><img src="/img/gallery/photo5.jpg" alt="Амбарные ручки и крючки" loading="lazy"></a>
    <a href="/img/gallery/photo6.jpg" target="_blank" rel="noopener"><img src="/img/gallery/photo6.jpg" alt="Полка в прихожую на трубах" loading="lazy"></a>
  </div>
</section>

<div id="lightbox"><img src="" alt=""></div>

<footer class="wrap">
  <p>Tricky Pipe Loft · С 2019 года</p>
  <p>
    <a href="https://vk.ru/tricky_pipe" target="_blank" rel="noopener">ВКонтакте</a>
    <a href="https://www.ozon.ru/seller/tricky-pipe-loft/" target="_blank" rel="noopener">Ozon</a>
    <a href="https://www.wildberries.ru/seller/211227" target="_blank" rel="noopener">Wildberries</a>
  </p>
</footer>

<script>
  // клик по фото открывает увеличенную версию поверх страницы
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.grid a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      lbImg.src = a.href;
      lb.classList.add('show');
    });
  });
  lb.addEventListener('click', () => lb.classList.remove('show'));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lb.classList.remove('show');
  });
</script>
</body>
</html>
